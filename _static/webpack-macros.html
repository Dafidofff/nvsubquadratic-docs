<meta name="robots" content="noindex, nofollow">
<title>Protected — password required</title>
<style>
  body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
          background:#0d1117; color:#c9d1d9; display:flex; min-height:100vh;
          align-items:center; justify-content:center; margin:0; }
  .box { background:#161b22; border:1px solid #30363d; border-radius:10px;
          padding:2rem 2.25rem; width:min(360px,90vw); box-shadow:0 8px 30px rgba(0,0,0,.4); }
  h1 { font-size:1.1rem; margin:0 0 1rem; font-weight:600; }
  input { width:100%; box-sizing:border-box; padding:.6rem .7rem; font-size:1rem;
           border-radius:6px; border:1px solid #30363d; background:#0d1117;
           color:#c9d1d9; margin-bottom:.75rem; }
  button { width:100%; padding:.6rem; font-size:1rem; border:0; border-radius:6px;
            background:#238636; color:#fff; cursor:pointer; }
  button:hover { background:#2ea043; }
  .err { color:#f85149; font-size:.85rem; min-height:1.1rem; margin-top:.5rem; }

<body>
<div class="box">
  <h1>This documentation is password-protected</h1>
  <form id="f">
    <input id="pw" type="password" placeholder="Password" autofocus autocomplete="current-password">
    <button type="submit">Unlock</button>
    <div class="err" id="err"></div>

</div>

const KEY = "docs-pw:" + CFG.ns;
const dec = (s) => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function deriveKey(password, salt) {
  const base = await crypto.subtle.importKey(
    "raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name:"PBKDF2", salt, iterations: CFG.iters, hash:"SHA-256" },
    base, { name:"AES-GCM", length:256 }, false, ["decrypt"]);
}

async function tryDecrypt(password) {
  const key = await deriveKey(password, dec(CFG.salt));
  const plain = await crypto.subtle.decrypt(
    { name:"AES-GCM", iv: dec(CFG.iv) }, key, dec(CFG.ct));
  return new TextDecoder().decode(plain);
}

async function unlock(password, remember) {
  const html = await tryDecrypt(password);   // throws on wrong password
  if (remember) try { sessionStorage.setItem(KEY, password); } catch (e) {}
  document.open(); document.write(html); document.close();
}

document.getElementById("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const err = document.getElementById("err");
  err.textContent = "";
  try { await unlock(document.getElementById("pw").value, true); }
  catch (_) { err.textContent = "Wrong password."; }
});

// Auto-unlock if we already have the password from this session.
(async () => {
  let saved = null;
  try { saved = sessionStorage.getItem(KEY); } catch (e) {}
  if (saved) { try { await unlock(saved, false); } catch (_) {
    try { sessionStorage.removeItem(KEY); } catch (e) {}
  } }
})();
</script>
